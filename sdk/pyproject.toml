[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-engine-sdk"
version = "0.2.0"
description = "An LLM agent desk for the trading-engine mock exchange: analyst, strategist, PM, risk, execution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.3",
  "pydantic>=2.7",
  "requests>=2.31",
  "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trading-desk = "trading_engine.cli:main"

[tool.setuptools.packages.find]
include = ["trading_engine*"]
